<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investigadores en acción · Formación 1</title>
<meta name="description" content="Dale play a tu curiosidad. Sala de cómputo con juegos para aprender el proceso de investigación.">
<link rel="icon" href="assets/logo-ut.png">
<link rel="stylesheet" href="css/hub.css">
</head>
<body>
<div class="fondo" aria-hidden="true"></div>

<header class="hud">
  <div class="hud-logos">
    <img src="assets/logo-conocimiento.webp" alt="Universidad del Tolima · Conocimiento que transforma" class="l-con" width="900" height="258" decoding="async" fetchpriority="high">
    <img src="assets/logo-idead.webp" alt="IDEAD en los territorios" class="l-ide" width="500" height="304" decoding="async">
  </div>
  <div class="titulo">
    <span class="etiqueta" id="etiqueta">Formación 1</span>
    <h1 id="titulo">Investigadores en acción</h1>
    <p class="slogan" id="slogan">Dale play a tu curiosidad</p>
  </div>
  <div class="hud-prog" aria-live="polite">
    <span class="mini">Progreso</span>
    <span class="barra" id="barra"></span>
    <span class="num" id="progNum">0/3</span>
  </div>
</header>

<main class="escenario">
  <div class="escena" id="escena">
    <canvas id="sala" width="320" height="240" role="img" aria-label="Sala de cómputo con dos computadores y una máquina de arcade"></canvas>
    <div id="zonas"></div>
    <div class="burbuja" id="burbuja" role="status"><span id="burbujaTxt"></span></div>
  </div>
</main>

<footer class="paneles">
  <section class="panel proceso">
    <h2>El proceso</h2>
    <ol id="proceso"></ol>
  </section>
  <section class="panel lista">
    <h2>Estaciones de juego</h2>
    <ul id="lista"></ul>
  </section>
  <section class="panel detalle" id="detalle" aria-live="polite">
    <h2 id="dTipo"></h2>
    <p class="d-nombre" id="dNombre"></p>
    <p class="d-desc" id="dDesc"></p>
    <div class="chips" id="dChips"></div>
    <a class="jugar" id="dJugar" href="#">JUGAR</a>
  </section>
</footer>

<!-- Ventana emergente: los juegos se abren aquí, como una ventana de navegador -->
<div class="ventana-fondo" id="ventanaFondo" hidden>
  <div class="ventana" id="ventana" role="dialog" aria-modal="true" aria-labelledby="ventanaTitulo">
    <div class="v-barra">
      <span class="v-puntos" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="v-url" id="ventanaTitulo">investigadores-en-accion</span>
      <button type="button" class="v-cerrar" id="ventanaCerrar" aria-label="Cerrar ventana y volver a la sala">&#10005; <span>CERRAR</span></button>
    </div>
    <div class="v-cuerpo">
      <div class="v-carga" id="ventanaCarga" aria-hidden="true">Cargando…</div>
      <iframe id="ventanaMarco" title="Juego" allow="fullscreen"></iframe>
    </div>
  </div>
</div>
<script src="js/hub-data.js"></script>
<script src="js/sala.js"></script>
<script src="js/hub.js"></script>
</body>
</html>
