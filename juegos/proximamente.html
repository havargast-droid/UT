<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Próximamente · Investigadores en acción</title>
<link rel="icon" href="../assets/logo-ut.png">
<style>
@font-face{font-family:"Press Start 2P";src:url(../assets/fonts/press-start-2p-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Pixelify Sans";font-weight:600;src:url(../assets/fonts/pixelify-sans-latin-600-normal.woff2) format("woff2")}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;background-color:#E3EEF1;background-image:radial-gradient(#CFE1E6 2px,transparent 2.5px);background-size:24px 24px;color:#203655;font:600 18px 'Pixelify Sans',sans-serif;text-align:center}
.caja{background:#FDFAE9;border:4px solid #14233B;box-shadow:8px 8px 0 #14233B;padding:28px;max-width:520px}
h1{font:400 18px/1.5 'Press Start 2P',monospace;color:#E23C48;margin:14px 0}
.obra{font:400 40px 'Press Start 2P',monospace;animation:b 1s steps(2) infinite}
@keyframes b{50%{translate:0 -8px}}
a{display:inline-block;margin-top:18px;font:400 11px 'Press Start 2P',monospace;text-decoration:none;background:#E23C48;color:#FDFAE9;padding:12px 16px;border:3px solid #14233B;box-shadow:4px 4px 0 #14233B}
a:hover{background:#F6D26B;color:#14233B}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="caja">
  <div class="obra" aria-hidden="true">...</div>
  <h1 id="t">Juego en construcción</h1>
  <p id="d">Este computador aún se está armando. ¡Vuelve pronto!</p>
  <a href="../index.html">VOLVER A LA SALA</a>
</div>
<script>
/* Si el juego está dentro de la ventana de la sala, "volver" cierra la ventana en vez de recargar la sala */
if(window.parent!==window){document.documentElement.classList.add("embebido");
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href$='index.html']");
if(a&&/(^|\/)\.\.\/(\.\.\/)?index\.html$/.test(a.getAttribute("href"))){e.preventDefault();parent.postMessage({tipo:"cerrar-ventana"},"*")}})}
</script>
<script>
const J={memoria:["Memoria de la investigación","Voltea cartas, encuentra parejas y responde preguntas del proceso. Estará listo muy pronto."],
arcade:["Arcade del método","Atrapa conceptos al vuelo y llévalos a su etapa. La máquina está calentando motores."]};
const k=new URLSearchParams(location.search).get("j");
if(J[k]){document.getElementById("t").textContent=J[k][0];document.getElementById("d").textContent=J[k][1];document.title=J[k][0]+" · Próximamente"}
</script></body></html>
